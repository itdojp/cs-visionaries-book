name: 📝 Book Feedback / 書籍フィードバック
description: Share feedback about this book and its published site / 本書と公開サイトへのフィードバック
title: "[Feedback] "
labels: ["feedback", "user-experience"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reading this book.
        Your feedback helps improve the published content and reader experience.
        
        本書をご利用いただき、ありがとうございます。
        皆様のフィードバックが、公開コンテンツと読書体験の改善に役立ちます。

  - type: dropdown
    id: user-type
    attributes:
      label: User Type / ユーザータイプ
      description: Which describes you best? / あなたに最も近いタイプは？
      options:
        - General reader / 一般読者
        - Engineer / 技術者
        - Editor or contributor / 編集者・コントリビューター
    validations:
      required: true

  - type: dropdown
    id: overall-satisfaction
    attributes:
      label: Overall Satisfaction / 総合満足度
      description: How satisfied are you with this book and site? / 本書と公開サイトにどの程度満足していますか？
      options:
        - 5 - Very satisfied / とても満足
        - 4 - Satisfied / 満足
        - 3 - Neutral / 普通
        - 2 - Dissatisfied / 不満
        - 1 - Very dissatisfied / とても不満
    validations:
      required: true

  - type: dropdown
    id: setup-experience
    attributes:
      label: Setup Experience / セットアップ体験
      description: How easy was it to find what you needed? / 必要な情報へどの程度たどり着きやすかったですか？
      options:
        - 5 - Very easy / とても簡単
        - 4 - Easy / 簡単
        - 3 - Moderate / 普通
        - 2 - Difficult / 難しい
        - 1 - Very difficult / とても難しい
    validations:
      required: true

  - type: textarea
    id: liked-features
    attributes:
      label: What you liked most / 最も気に入った機能
      description: What features or aspects do you like most about this book and site? / 本書と公開サイトで最も気に入った機能や側面は何ですか？
      placeholder: |
        Example: chapter flow, appendix usefulness, cross-links, clarity of explanations...
        例：章構成、付録の使いやすさ、クロスリンク、説明の明確さ...
    validations:
      required: false

  - type: textarea
    id: pain-points
    attributes:
      label: Pain points / 困った点
      description: What challenges or issues did you encounter? / どのような課題や問題に遭遇しましたか？
      placeholder: |
        Example: confusing chapter mapping, outdated wording, broken navigation...
        例：章対応の分かりにくさ、古い表現、ナビゲーション不備...
    validations:
      required: false

  - type: textarea
    id: feature-requests
    attributes:
      label: Feature requests / 機能要望
      description: What features would you like to see added? / 追加して欲しい機能はありますか？
      placeholder: |
        Example: more historical sources, better glossary, reading routes, figure index...
        例：史料の追加、用語集の改善、読み方ガイド、図版索引...
    validations:
      required: false

  - type: checkboxes
    id: would-recommend
    attributes:
      label: Recommendation / 推薦
      description: Would you recommend this book to others? / 本書を他の人に推薦しますか？
      options:
        - label: Yes, I would recommend this book / はい、本書を推薦します
        - label: I would suggest improvements first / 改善してから推薦したいです
        - label: No, I would not recommend it / いいえ、推薦しません

  - type: textarea
    id: additional-comments
    attributes:
      label: Additional comments / その他のコメント
      description: Any other thoughts or suggestions? / その他のご意見や提案はありますか？
      placeholder: |
        Feel free to share any other thoughts about your experience...
        体験に関するその他のご意見をお聞かせください...
    validations:
      required: false
