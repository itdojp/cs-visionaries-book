# Jekyll設定
title: "デジタル革命の舞台裏"
description: "コンピュータサイエンスを築いた人物と技術潮流の物語 - 計算理論、ソフトウェア基盤、インターネット、AIまで、現代のデジタル社会を形作った発想と意思決定をたどる"
author: "ITDO Inc. (株式会社アイティードゥ)"
author_profile:
  github: itdojp
  email: knowledge@itdo.jp
baseurl: "/cs-visionaries-book"
url: "https://itdojp.github.io"
contact:
  email: knowledge@itdo.jp

# Repository settings for links
repository:
  github: itdojp/cs-visionaries-book  # GitHub repository path
  zenn: books/cs-visionaries-book      # Zenn book path

# テーマ
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

# 言語設定
lang: ja
permalink: pretty

# その他の設定
show_downloads: false
google_analytics:

# ビルド設定
exclude:
  - README.md
  - package.json
  - package-lock.json
  - node_modules/
  - scripts/
  - .gitignore
  - LICENSE
  - CONTRIBUTING.md
  - src/
